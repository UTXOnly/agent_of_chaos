# The stack `aoc run` and `aoc ab` drive: the fake logs intake and the
# agent under test. The log generators are not here; aoc renders one
# service per generator from the workload profile into a compose override
# next to the results (results/<run>/compose.override.yml), so a workload
# is a YAML file and nothing else.
#
# The intake and the agent share a network namespace: the agent sends logs
# to localhost:8282, and the intake scrapes the agent's localhost-only
# telemetry on :5000. The logs go to the intake, never to Datadog; the
# intake's aoc.* metrics and events and the agent's own metrics and
# profiles go to Datadog, tagged run:<name>.
#
# Variables (aoc sets them per run): DD_AGENT_IMAGE, AOC_RUN_NAME,
# AOC_STACK (a second stack beside the first: aoc ab runs a and b this
# way), AOC_INTAKE_PORT / AOC_TCP_PORT, AOC_INITIAL_FAULTS, AOC_DD_TAGS,
# DD_TAGS.
# docker-compose.offline.yml stacks on top when there is no Datadog account.

name: aoc

services:
  intake:
    image: agent-of-chaos:latest
    build:
      context: .
      args:
        VERSION: ${AOC_VERSION:-dev}
    container_name: ${AOC_STACK:-aoc}-intake
    # Root, to read docker.sock for the agent container's CPU and memory.
    user: "0:0"
    command:
      - intake
      - --name=${AOC_RUN_NAME:-local}
      - --agent-telemetry=http://localhost:5000/telemetry
      - --docker-container=${AOC_STACK:-aoc}-agent
      - --agent-image=${DD_AGENT_IMAGE:-datadog/agent:7}
      - --dd-tags=${AOC_DD_TAGS:-harness:aoc}
      # The agent's profiler uploads land here (DD_APM_PROFILING_DD_URL
      # below): a copy is kept for the results directory and the upload is
      # forwarded to Datadog unchanged. off keeps the copies only.
      - --profile-forward=${AOC_PROFILE_FORWARD:-auto}
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY in .env (or use docker-compose.offline.yml)}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      AOC_DD_METRICS: ${AOC_DD_METRICS:-true}
      # A profile's `boot: true` fault step, in place before the agent starts.
      AOC_INITIAL_FAULTS: ${AOC_INITIAL_FAULTS:-}
    ports:
      - "${AOC_INTAKE_PORT:-8282}:8282"
      - "${AOC_TCP_PORT:-10516}:10516"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8282/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  datadog-agent:
    image: ${DD_AGENT_IMAGE:-datadog/agent:7}
    container_name: ${AOC_STACK:-aoc}-agent
    network_mode: "service:intake"
    pid: host
    depends_on:
      intake:
        condition: service_healthy
    stop_grace_period: 20s
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY in .env (or use docker-compose.offline.yml)}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ${DD_HOSTNAME:-${AOC_STACK:-aoc}-harness}
      DD_ENV: ${DD_ENV:-aoc-harness}
      # run:<name> lines the agent's own metrics and profiles up with the
      # intake's aoc.* metrics.
      DD_TAGS: "harness:aoc run:${AOC_RUN_NAME:-local} ${DD_TAGS:-}"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_LOGS_DD_URL: http://localhost:8282
      DD_LOGS_CONFIG_LOGS_NO_SSL: "true"
      DD_LOGS_CONFIG_USE_HTTP: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: ${DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL:-true}
      # Only this stack's generators are this agent's workload, not the
      # other side of an A/B or whatever else runs on the host. Include
      # rules win over exclude rules.
      DD_CONTAINER_EXCLUDE_LOGS: "name:.*"
      DD_CONTAINER_INCLUDE_LOGS: "name:^${AOC_STACK:-aoc}-gen-"
      DD_LOGS_CONFIG_OPEN_FILES_LIMIT: ${DD_LOGS_CONFIG_OPEN_FILES_LIMIT:-500}
      DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION: ${DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION:-false}
      DD_TELEMETRY_ENABLED: "true"
      DD_LOG_LEVEL: ${DD_LOG_LEVEL:-info}
      # Profiles upload through the trace-agent, so APM stays on.
      DD_APM_ENABLED: ${DD_APM_ENABLED:-true}
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "false"
      DD_PROCESS_CONFIG_CONTAINER_COLLECTION_ENABLED: "false"
      DD_REMOTE_CONFIGURATION_ENABLED: "false"
      # One profile per minute with a full-minute CPU sample (the agent's
      # default period is 5 minutes, too coarse for a short run). The last
      # partial period of a run is not uploaded.
      DD_INTERNAL_PROFILING_ENABLED: ${DD_INTERNAL_PROFILING_ENABLED:-true}
      DD_INTERNAL_PROFILING_PERIOD: ${DD_INTERNAL_PROFILING_PERIOD:-60s}
      DD_INTERNAL_PROFILING_CPU_DURATION: ${DD_INTERNAL_PROFILING_CPU_DURATION:-60s}
      DD_INTERNAL_PROFILING_EXTRA_TAGS: "harness:aoc run:${AOC_RUN_NAME:-local} ${DD_TAGS:-}"
      # The trace-agent proxies profile uploads to the intake instead of
      # intake.profile.<site>; the intake keeps them for results/<run>/profiles/
      # and forwards them.
      DD_APM_PROFILING_DD_URL: ${DD_APM_PROFILING_DD_URL:-http://localhost:8282/api/v2/profile}
    volumes:
      - aoc-logs:/var/log/agent-of-chaos:ro
      - ./datadog/conf.d/agent_of_chaos.d:/etc/datadog-agent/conf.d/agent_of_chaos.d:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      # json-file driver logs, so stdout generators are tailed as files.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Tailing offsets survive an agent restart (dropped by `down -v`).
      - aoc-agent-run:/opt/datadog-agent/run

volumes:
  aoc-logs:
  aoc-agent-run:
