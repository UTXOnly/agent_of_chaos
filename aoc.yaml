# aoc.yaml — the settings every A/B test on this checkout runs with.
#
# What a given test is about comes from the command line:
#
#   aoc ab --b IMAGE --workload NAME --focus "the question this answers"
#
# See aoc.example.yaml for every setting with its default and what it does.

## The control: a moving tag, re-pulled before every run, so it really is
## the latest 7.x release.
a:
  image: datadog/agent:7

## The workload both sides get when --workload does not name one.
profile: profiles/baseline.yaml

## The measured window, whatever the workload says: ten minutes gives the
## profiler nine or ten periods per side, enough to average out GC and
## rotation noise. --duration 2m is a smoke.
duration: 10m

## Agent settings both sides get. Per-test flags go in --b-env / --env.
env: {}
# env:
#   DD_INTERNAL_PROFILING_PERIOD: 60s

## Rounds per side: tables and the verdict take the median, the notebook
## overlays each round.
runs: 2

## Percent change on a headline metric that counts as a finding, per
## signal. --threshold sets all four at once.
thresholds:
  throughput: 5
  saturation: 10
  cpu: 5
  memory: 5

## A checkout of the agent's repository, for the brief's code section.
## Default: $DATADOG_AGENT_SRC, else ../datadog-agent.
# source: ~/src/datadog-agent

## Packages under test: the brief puts profile movers there first.
## Default: the logs packages (comp/logs*, pkg/logs). --code narrows it.
# code: [pkg/logs/sender]

## Results root; the brief lands in <results>/<experiment>/findings.md.
results: results

## Create the A/B notebook in Datadog. Default: true when DD_APP_KEY is
## set; notebook.json is always written.
# notebook: true
