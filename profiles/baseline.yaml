name: baseline
description: Steady mixed load, the reference point for every other workload. 8 plain-text and 8 JSON file streams at 5,000 lines/s per generator, 5% stack traces, 2 MiB rotation.
duration: 3m
warmup: 20s
drain: 45s
generators:
  plain: { streams: 8, rate: 5000 }
  json:  { format: json, streams: 8, rate: 5000 }
