name: deterministic-bytes
description: Byte-identical input written as fast as the disk allows. Seeded content, synthetic timestamps, a fixed budget of 2,000,000 records across 8 streams. Every run feeds the agent the same bytes, so wire bytes and CPU per log are directly comparable; throughput is the agent's maximum. No end-to-end latency, since the timestamps are synthetic.
duration: 4m
warmup: 10s
drain: 60s
generators:
  plain: { streams: 8, rate: 0, max-lines: 2000000, deterministic: true, seed: 42, rotate-bytes: 4MiB }
