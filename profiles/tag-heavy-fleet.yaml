name: tag-heavy-fleet
description: Tag volume under load. 15 application containers logging to stdout at 500 lines/s each, collected through the docker log driver, every line carrying about 40 tags (container and image tags, 20 docker labels, 15 host tags). Compare with and without DD_LOGS_CONFIG_TAG_FILTERS; watch tag bytes per log, CPU and allocations in the processor.
duration: 3m
warmup: 30s
drain: 60s
agent:
  env:
    # Every docker label below becomes a tag on the container's logs.
    DD_DOCKER_LABELS_AS_TAGS: '{"app":"app","team":"team","tier":"tier","owner":"owner","component":"component","release":"release","build_id":"build_id","git_sha":"git_sha","region":"region","zone":"zone","cluster":"cluster","namespace":"namespace","deployment":"deployment","pod_template_hash":"pod_template_hash","language":"language","framework":"framework","cost_center":"cost_center","sla":"sla","pci":"pci","canary":"canary","traffic_class":"traffic_class"}'
    # Host-level tags on top of the harness's run:/experiment:/variant: tags.
    DD_EXTRA_TAGS: "project:agent-of-chaos availability-zone:local-a cloud_provider:none instance-type:laptop kernel:docker-desktop vcpu:8 os:linux arch:arm64 fleet:tag-heavy datacenter:lab rack:r1 image_scan:clean compliance:none maintainer:platform"
generators:
  app:
    output: stdout
    replicas: 15
    streams: 1
    rate: 500
    multiline-rate: 0
    labels:
      app: app-{n}
      team: payments
      tier: web
      owner: payments-oncall
      component: app-{n}-web
      release: "2026.09.1"
      build_id: b1037
      git_sha: 9e3779b1
      region: us-east-1
      zone: us-east-1b
      cluster: lab-1
      namespace: payments
      deployment: app-{n}-deploy
      pod_template_hash: "07919"
      language: python
      framework: django
      cost_center: cc-101
      sla: silver
      pci: "false"
      canary: "false"
      traffic_class: external
