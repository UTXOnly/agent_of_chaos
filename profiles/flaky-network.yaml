name: flaky-network
description: A bad uplink that recovers. From 30 s to 3 min, 10% of requests get no response, every response is delayed 300±200 ms, and bodies are read at 500 kB/s. The hardest case for exactly-once delivery; watch duplicates.
duration: 4m
warmup: 20s
drain: 90s
generators:
  plain: { streams: 8, rate: 5000 }
  json:  { format: json, streams: 8, rate: 5000 }
faults:
  - at: 30s
    set: { drop_rate: 0.1, latency_ms: 300, jitter_ms: 200, read_bps: 500000, note: "flaky uplink" }
  - at: 180s
    clear: true
