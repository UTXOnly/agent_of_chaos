name: multiline-heavy
description: 35% of records carry Python/Java/Go stack traces. Orphan continuation lines and "multiline received / written" show whether aggregation kept up; try with and without DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION.
duration: 3m
warmup: 20s
drain: 45s
agent:
  env:
    DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION: "false"
generators:
  gen-plain: { streams: 12, rate: 8000, multiline-rate: 0.35 }
  gen-json:  { enabled: false }
