# Tag-heavy fleet: 15 application containers, one log stream each, logging to
# stdout so the agent collects them through the docker log driver and tags
# every line with container_name/container_id/docker_image/image_name/
# image_tag/short_image plus ~20 docker labels (DD_DOCKER_LABELS_AS_TAGS in
# profiles/tag-heavy-fleet.yaml) and ~15 host tags (DD_EXTRA_TAGS). Stacked on
# docker-compose.yml by that profile's `compose:`; container names are
# <stack>-gen-app-NN-1, so the agent's include rule (^<stack>-gen-) picks
# them up and only them.

x-app: &app
  image: agent-of-chaos:latest
  # The agent's docker launcher tails a new container from where it is when
  # it discovers it; without this pause the first second of every stream
  # (seq 1..N) is lost on both sides and the gate fails for nothing.
  entrypoint: ["sh", "-c", "sleep 20 && exec aoc generate"]
  restart: unless-stopped
  stop_grace_period: 20s
  depends_on:
    intake:
      condition: service_healthy

services:

  gen-app-01:
    <<: *app
    environment:
      AOC_INTAKE: http://intake:8282
      AOC_NAME: app-01
      AOC_OUTPUT: stdout
      AOC_FORMAT: plain
    labels:
      app: 'app-01'
      team: 'payments'
      tier: 'web'
      owner: 'payments-oncall'
      component: 'payments-web'
      release: '2026.09.1'
      build_id: 'b1037'
      git_sha: '9e3779b1'
      region: 'us-east-1'
      zone: 'us-east-1b'
      cluster: 'lab-1'
      namespace: 'payments'
      deployment: 'app-01-deploy'
      pod_template_hash: '07919'
      language: 'python'
      framework: 'django'
      cost_center: 'cc-101'
      sla: 'silver'
      pci: 'false'
      canary: 'false'
      traffic_class: 'external'
      com.datadoghq.ad.logs: '[{"source":"agent-of-chaos","service":"app-01"}]'

  gen-app-02:
    <<: *app
    environment:
      AOC_INTAKE: http://intake:8282
