# Tag-filter fleet: 15 log generators (8 plain-text, 7 JSON) tailed by a single
# datadog/agent-dev:log-tag-filtering build.
#
# This file alone is the BASELINE (no DD_LOGS_CONFIG_TAG_FILTERS). Stack the
# overlay to get the COMPARISON with tag filters applied:
#
#   cp .env.example .env   # set DD_API_KEY (and DD_SITE if not datadoghq.com)
#   # baseline
#   docker compose -f docker-compose.tag-filter.yml up --build -d
#   # with tag filters
#   docker compose -f docker-compose.tag-filter.yml -f docker-compose.tag-filter.filters.yml up --build -d
#   docker compose -f docker-compose.tag-filter.yml logs -f datadog-agent
#   docker compose -f docker-compose.tag-filter.yml down
#
# Every generator writes to its own subdir of ./logs/tag-filter/<name>/ and the
# agent tails those files (see datadog/conf.d/agent_of_chaos.d/conf.yaml), so
# each log carries filename:/dirname: tags. Logs come from files only
# plus container stdout via the docker socket (container_collect_all on).

name: aoc-tag-filter

x-generator: &generator
  image: agent-of-chaos:latest
  restart: unless-stopped
  volumes:
    - ./logs/tag-filter:/var/log/agent-of-chaos

x-generator-env: &generator-env
  AOCH_MODE: ${AOCH_FLEET_MODE:-steady}
  AOCH_SERVICES: ${AOCH_FLEET_SERVICES:-4}
  AOCH_LINES_PER_CYCLE: ${AOCH_FLEET_LINES_PER_CYCLE:-20}
  AOCH_CYCLE_SLEEP_MS: ${AOCH_FLEET_CYCLE_SLEEP_MS:-250}
  AOCH_MAX_BYTES: ${AOCH_FLEET_MAX_BYTES:-524288}
  AOCH_BACKUP_COUNT: ${AOCH_FLEET_BACKUP_COUNT:-3}

# Plain-text half of the fleet: *.log only.
x-plain-env: &plain-env
  <<: *generator-env
  AOCH_BENCHMARK_PLAIN_ONLY: "true"

services:
  datadog-agent:
    image: datadog/agent-dev:log-tag-filtering-9e35a50b-full
    container_name: dd-agent-tag-filter
    restart: unless-stopped
    pid: host
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ${DD_HOSTNAME:-aoc-tag-filter-lab}
      DD_ENV: tagfilter-lab
      # Host-level tags that the filter is expected to strip from every log.
      DD_TAGS: >-
        experiment:log-tag-filter
        variant:${AOC_VARIANT:-local}
        project:agent-of-chaos
        region:local
        availability-zone:local-a
        cloud_provider:none
        instance-type:laptop
        kernel:docker-desktop
        vcpu:8
        version:fleet-1
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE_LOGS: "name:dd-agent-tag-filter"
      DD_LOGS_CONFIG_OPEN_FILES_LIMIT: "500"
      DD_LOG_LEVEL: ${DD_LOG_LEVEL:-info}
      DD_INTERNAL_PROFILING_ENABLED: "true"
    volumes:
      - ./logs/tag-filter:/var/log/agent-of-chaos:ro
      - ./datadog/conf.d/agent_of_chaos.d:/etc/datadog-agent/conf.d/agent_of_chaos.d:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    depends_on:
      - plain-01
      - json-01

  # ── plain-text generators (8) ───────────────────────────────────────────────
  plain-01:
    <<: *generator
    build: .   # only one service builds the shared image; the rest reuse it
    container_name: aoc-plain-01
    environment: { <<: *plain-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/plain-01 }
  plain-02:
    <<: *generator
    container_name: aoc-plain-02
    environment: { <<: *plain-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/plain-02 }
  plain-03:
    <<: *generator
    container_name: aoc-plain-03
    environment: { <<: *plain-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/plain-03 }
  plain-04:
    <<: *generator
    container_name: aoc-plain-04
    environment: { <<: *plain-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/plain-04 }
  plain-05:
    <<: *generator
    container_name: aoc-plain-05
    environment: { <<: *plain-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/plain-05 }
  plain-06:
    <<: *generator
    container_name: aoc-plain-06
    environment: { <<: *plain-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/plain-06 }
  plain-07:
    <<: *generator
    container_name: aoc-plain-07
    environment: { <<: *plain-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/plain-07 }
  plain-08:
    <<: *generator
    container_name: aoc-plain-08
    environment: { <<: *plain-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/plain-08 }

  # ── JSON generators (7) ─────────────────────────────────────────────────────
  # These write both *.log and *.json.log; the agent config only tails the JSON file.
  json-01:
    <<: *generator
    container_name: aoc-json-01
    environment: { <<: *generator-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/json-01 }
  json-02:
    <<: *generator
    container_name: aoc-json-02
    environment: { <<: *generator-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/json-02 }
  json-03:
    <<: *generator
    container_name: aoc-json-03
    environment: { <<: *generator-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/json-03 }
  json-04:
    <<: *generator
    container_name: aoc-json-04
    environment: { <<: *generator-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/json-04 }
  json-05:
    <<: *generator
    container_name: aoc-json-05
    environment: { <<: *generator-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/json-05 }
  json-06:
    <<: *generator
    container_name: aoc-json-06
    environment: { <<: *generator-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/json-06 }
  json-07:
    <<: *generator
    container_name: aoc-json-07
    environment: { <<: *generator-env, AOCH_LOG_DIR: /var/log/agent-of-chaos/json-07 }
